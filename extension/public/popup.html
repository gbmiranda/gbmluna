<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Luna — gbml</title>
    <style>
      /* Paleta Meia-noite do Luna DS (docs/design-system.md) */
      :root {
        --t-bg-canvas: #0b0e14;
        --t-bg-surface: #131722;
        --t-fg: #e2e8f0;
        --t-fg-muted: #8b93a7;
        --t-accent: #d97757;
        --t-accent-fg: #0b0e14;
        --t-err: #e06c75;
        --t-border: #2a3040;
        --t-shadow: #000000;
      }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 16px;
        background: var(--t-bg-canvas);
        color: var(--t-fg);
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
        font-family: ui-monospace, "SF Mono", monospace;
        letter-spacing: 1px;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--t-border);
        border-radius: 2px;
        background: var(--t-accent);
        color: var(--t-accent-fg);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
        box-shadow: 2px 2px 0 var(--t-shadow);
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      button:focus-visible {
        outline: 2px solid var(--t-accent);
        outline-offset: 2px;
      }
      button.stop {
        background: var(--t-err);
      }
      button.secondary {
        background: var(--t-bg-surface);
        color: var(--t-fg);
        font-weight: 400;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
        color: var(--t-fg-muted);
      }
      select {
        width: 100%;
        margin-bottom: 12px;
        padding: 6px;
        border-radius: 2px;
        background: var(--t-bg-surface);
        color: var(--t-fg);
        border: 1px solid var(--t-border);
        box-shadow: inset 1px 1px 0 var(--t-shadow);
      }
      #status {
        margin: 8px 0 0;
        font-size: 12px;
        font-family: ui-monospace, "SF Mono", monospace;
        color: var(--t-fg-muted);
        min-height: 16px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>LUNA</h1>
    <button id="abrir-luna">Abrir Luna</button>
    <label for="source">Idioma do vídeo</label>
    <select id="source">
      <option value="en-US" selected>English (US)</option>
      <option value="pt-BR">Português (Brasil)</option>
      <option value="es-ES">Español</option>
      <option value="fr-FR">Français</option>
      <option value="de-DE">Deutsch</option>
      <option value="ja-JP">日本語</option>
    </select>
    <label for="target">Traduzir para</label>
    <select id="target">
      <option value="pt-BR" selected>Português (Brasil)</option>
      <option value="en-US">English (US)</option>
      <option value="es-ES">Español</option>
      <option value="fr-FR">Français</option>
      <option value="de-DE">Deutsch</option>
    </select>
    <button id="toggle">Legendar esta aba</button>
    <button id="ping" class="secondary">Testar host nativo</button>
    <p id="status">—</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
