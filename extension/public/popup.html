<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>gbmulti language</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 16px;
        background: #1c1c1e;
        color: #f2f2f7;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 8px;
        background: #0a84ff;
        color: white;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button.stop {
        background: #ff453a;
      }
      button.secondary {
        background: #3a3a3c;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
        color: #98989d;
      }
      select {
        width: 100%;
        margin-bottom: 12px;
        padding: 6px;
        border-radius: 6px;
        background: #2c2c2e;
        color: #f2f2f7;
        border: 1px solid #3a3a3c;
      }
      #status {
        margin: 8px 0 0;
        font-size: 12px;
        color: #98989d;
        min-height: 16px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>gbmulti language</h1>
    <label for="source">Idioma do vídeo</label>
    <select id="source">
      <option value="en-US" selected>English (US)</option>
      <option value="pt-BR">Português (Brasil)</option>
      <option value="es-ES">Español</option>
      <option value="fr-FR">Français</option>
      <option value="de-DE">Deutsch</option>
      <option value="ja-JP">日本語</option>
    </select>
    <label for="target">Traduzir para</label>
    <select id="target">
      <option value="pt-BR" selected>Português (Brasil)</option>
      <option value="en-US">English (US)</option>
      <option value="es-ES">Español</option>
      <option value="fr-FR">Français</option>
      <option value="de-DE">Deutsch</option>
    </select>
    <button id="toggle">Iniciar legendas</button>
    <button id="ping" class="secondary">Testar host nativo</button>
    <p id="status">—</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
